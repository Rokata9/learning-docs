<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chapter template</title><style>
:root{--ink:#172033;--muted:#5c667a;--line:#d9dfeb;--panel:#fff;--bg:#f5f7fb;--green:#047857;--blue:#1e40af;--amber:#b45309;--pink:#be185d;--code:#f8fafc}
*{box-sizing:border-box}body{margin:0;font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg)}
a{color:var(--blue)}main{max-width:1760px;margin:auto;padding:42px}.hero{background:linear-gradient(135deg,#ecfdf5,#eff6ff);border:1px solid #cbd5e1;border-radius:18px;padding:30px;margin-bottom:24px}.eyebrow{font-weight:750;color:var(--green);letter-spacing:.08em;text-transform:uppercase;font-size:12px}h1{font-size:40px;line-height:1.12;margin:8px 0 12px}h2{font-size:25px;margin:0 0 12px}.muted{color:var(--muted)}.stats{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}.pill{display:inline-block;background:#fff;border:1px solid #cbd5e1;border-radius:999px;padding:6px 11px;font-weight:700}.grid{display:grid;grid-template-columns:repeat(3,minmax(320px,1fr));gap:18px}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:0 8px 24px rgba(23,32,51,.05)}.card h2{font-size:20px}.phase{margin:30px 0 14px}.chapter-list{display:grid;grid-template-columns:repeat(4,minmax(260px,1fr));gap:14px}.chapter{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;text-decoration:none;color:var(--ink)}.chapter:hover{border-color:#94a3b8}.chapter strong{display:block;margin-bottom:6px}.chapter small{color:var(--muted)}table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line)}th,td{text-align:left;padding:11px 13px;border-bottom:1px solid var(--line);vertical-align:top}th{background:#eef2f7}.nav{display:flex;justify-content:space-between;margin-top:28px}.note{border-left:4px solid var(--amber);background:#fffbeb;padding:14px 16px;border-radius:8px}.source{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:14px;color:#334155}.code{background:var(--code);color:#1f2937;border:1px solid #cbd5e1;border-radius:8px;padding:14px;overflow:auto;font:14px/1.55 ui-monospace,SFMono-Regular,Consolas,monospace}.tok-key{color:#7c3aed}.tok-type{color:#1d4ed8}.tok-str{color:#047857}.tok-num{color:#b45309}.tok-com{color:#6b7280;font-style:italic}.tok-fn{color:#be185d}
</style></head><body><main><section class="hero"><div class="eyebrow">Phase · Chapter</div><h1>Chapter title</h1><p>Purpose and milestone.</p></section><table><thead><tr><th>Lesson</th><th>Outcome</th><th>Status</th></tr></thead><tbody><tr><td>X.1</td><td>One concept</td><td>planned</td></tr></tbody></table></main></body></html>
